<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego 💖 | Webs y Apps con Amor</title>
    <style>
        :root {
            --rosa: #FF9EB7;  /* Rosa pastel */
            --morado: #D4A5FF; /* Morado suave */
            --blanco: #FFF9FB;
            --texto: #5A3D5C;
        }
        
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: var(--blanco);
            color: var(--texto);
            text-align: center;
        }
        
        header {
            background: linear-gradient(135deg, var(--rosa), var(--morado));
            padding: 2rem;
            color: white;
            border-radius: 0 0 20px 20px;
        }
        
        h1::after {
            content: " 💖";
        }
        
        .project-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin: 20px;
            box-shadow: 0 5px 15px rgba(255, 158, 183, 0.3);
            display: inline-block;
            width: 300px;
        }
        
        .project-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px dashed var(--rosa);
        }
        
        .corazon {
            font-size: 24px;
            animation: latir 1s infinite;
            display: inline-block;
        }
        
        @keyframes latir {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        footer {
            margin-top: 30px;
            color: var(--rosa);
        }
    </style>
</head>
<body>
    <header>
        <h1>Diego</h1>
        <p>Creo webs y apps con mucho amor 💝</p>
    </header>
    
    <main>
        <!-- Proyecto 1 -->
        <div class="project-card">
            <img src="images/nexx.png" alt="Web Bonita" class="project-image">
            <h3>Página Web Dulce como un Pastel</h3>
            <p>Diseño tierno y funcional para tu negocio. ¡Perfecta para vender con estilo! <span class="corazon">💝</span></p>
        </div>
        
        <!-- Proyecto 2 -->
        <div class="project-card">
            <img src="images/nexxx.png" alt="App Amorosa" class="project-image">
            <h3>App que Enamora</h3>
            <p>Tu aplicación favorita, suave como un algodón de azúcar. <span class="corazon">💖</span></p>
        </div>
    </main>
    
    <footer>
        <p>Hecho con <span class="corazon">💗</span> por Diego</p>
    </footer>
    
    <script>
        // Efecto de corazones cayendo
        document.addEventListener('click', function(e) {
            const corazon = document.createElement('div');
            corazon.innerHTML = '💝';
            corazon.style.position = 'absolute';
            corazon.style.left = e.clientX + 'px';
            corazon.style.top = e.clientY + 'px';
            corazon.style.fontSize = '20px';
            corazon.style.animation = 'volar 3s linear forwards';
            
            document.body.appendChild(corazon);
            
            setTimeout(() => {
                corazon.remove();
            }, 3000);
        });
    </script>
</body>
</html>
